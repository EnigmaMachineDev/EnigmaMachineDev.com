      - generic [ref=e24]:
        - generic [ref=e25]:
          - generic [ref=e26]: 📚
          - heading "Two Axes, Not One Shelf" [level=3] [ref=e27]
          - paragraph [ref=e28]: "Most trackers force one status: want to read, reading, or read. Lectio keeps owning and reading apart, so a library book you loved can sit on the wishlist, and a reference volume can be owned and never read straight through."
        - generic [ref=e29]:
          - generic [ref=e30]: 🔁
          - heading "Rereads Keep Their Own Record" [level=3] [ref=e31]
          - paragraph [ref=e32]: Each pass through a book has its own dates, rating, and review. The second reading can land differently from the first, and neither overwrites the other.
        - generic [ref=e33]:
          - generic [ref=e34]: 🎲
          - heading "Draw The Next One" [level=3] [ref=e35]
          - paragraph [ref=e36]: A uniform draw from what you could actually pick up right now. It will not offer a book you do not own, and it can hold back volume four while volume two is still unread on the shelf.
        - generic [ref=e37]:
          - generic [ref=e38]: ✍️
          - heading "Marginalia Worth Keeping" [level=3] [ref=e39]
          - paragraph [ref=e40]: Passages and the thoughts they provoked, against a page, a chapter, or a timestamp — exportable as Markdown, so your own words outlive the app.
        - generic [ref=e41]:
          - generic [ref=e42]: 🤝
          - heading "Who Has Your Copy" [level=3] [ref=e43]
          - paragraph [ref=e44]: Loans in both directions, with due dates and overdue nudges. Give a borrowed copy back and the reading record stays — because you still read it.
        - generic [ref=e45]:
          - generic [ref=e46]: 🔒
          - heading "Yours & Private" [level=3] [ref=e47]
          - paragraph [ref=e48]: No account, no sync, no metadata lookup, no cover fetching, no analytics. Lectio makes no network requests at all. Bring a Goodreads CSV in, and take a single-file backup out.
