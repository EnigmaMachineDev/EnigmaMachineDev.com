      - heading "Lectio" [level=1] [ref=e16]
      - paragraph [ref=e17]: A reading log that does not flatten what actually happens. Ownership and reading are separate, so a book can be wanted and finished at once — read from a library copy, and still worth having. Every reread keeps its own dates, rating, and review. And when you cannot decide, Lectio draws one from what is genuinely on the shelf.
